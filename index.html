<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Título y Descripción Primaria para SEO -->
  <title>LearnToKana - Práctica de Hiragana, Katakana y Kanji (JLPT, Kanken, Frecuencia)</title>
  <meta name="description" content="Aprende y practica Hiragana, Katakana y Kanji en contexto de palabras reales. Filtra por JLPT, Kanken, Grados escolares y Frecuencia con conversión automática de romaji a kana.">
  <meta name="keywords" content="japones, kanji, hiragana, katakana, jlpt, kanken, aprender japones, estudiar kanji, romaji converter">
  <meta name="author" content="jfhr1999">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook / Discord / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jfhr1999.github.io/LearnToKana/">
  <meta property="og:title" content="LearnToKana - Práctica Interactiva de Japonés">
  <meta property="og:description" content="Aprende y practica Hiragana, Katakana y Kanji por niveles JLPT, Kanken y palabras compuestas.">
  <meta property="og:image" content="https://jfhr1999.github.io/LearnToKana/data/og-image.png">

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://jfhr1999.github.io/LearnToKana/">
  <meta name="twitter:title" content="LearnToKana - Práctica Interactiva de Japonés">
  <meta name="twitter:description" content="Herramienta gratuita para practicar Hiragana, Katakana y Kanji interactivo en palabras reales.">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://jfhr1999.github.io/LearnToKana/">
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Cambiar tema">🌙</button>
    
    <div class="container">
        <!-- Vista de Selección / Configuración -->
        <section id="setup-view" class="view active">
          <h1>Configuración de Estudio</h1>

          <!-- Selector de Sistema principal -->
          <div class="tabs">
              <button class="tab-btn active" data-system="hiragana">Hiragana</button>
              <button class="tab-btn" data-system="katakana">Katakana</button>
              <button class="tab-btn" data-system="kanji">Kanji</button>
          </div>

          <!-- Selector Global de Categoría Kanji (Solo visible cuando Kanji está activo) -->
          <div id="kanji-category-wrapper" class="kanji-filter-container" style="display: none;">
              <label for="kanji-category-select"><strong>Categoría Kanji:</strong></label>
              <select id="kanji-category-select" class="form-select">
                  <option value="jlpt">JLPT</option>
                  <option value="frequency">Frequency</option>
                  <option value="kanken">Kanken</option>
                  <option value="numbers">Grade / Numbers</option>
              </select>
          </div>

          <!-- Contenedor dinámico de tarjetas de grupos -->
          <div id="groups-container">
              <!-- Generado dinámicamente desde app.js -->
          </div>

          <button id="start-btn" class="btn-primary" disabled>Empezar Práctica</button>
        </section>

        <!-- Vista del Juego / Práctica -->
        <section id="quiz-view" class="view">
          <header class="quiz-header">
              <button id="exit-btn" class="btn-secondary">← Menú</button>
              <span id="card-badge" class="badge">JLPT N5 · Bloque 1</span>
              <div class="score-tracker">
                <span id="score-correct">✓ 0</span> | <span id="score-incorrect">✗ 0</span>
              </div>
          </header>

          <main class="card-container">
              <div class="card">
                <div id="card-prompt" class="prompt-text">建物</div>
                <div id="card-meaning" class="meaning-text">Edificio</div>
              </div>

              <form id="quiz-form" autocomplete="off">
                <input 
                    type="text" 
                    id="answer-input" 
                    placeholder="Escribe en Kana (ej. たてもの)..." 
                    autofocus 
                />
                <button type="submit" class="btn-primary">Enviar</button>
              </form>

              <div id="feedback-msg" class="feedback"></div>
          </main>
        </section>
    </div>

    <!-- Modal Unificado de Selección de Subgrupos y Partes -->
    <div id="subgroup-modal" class="modal-overlay">
      <div class="modal-card">
          <div class="modal-header">
            <h3 id="modal-title">Seleccionar Subgrupos</h3>
            <button id="close-modal-btn" class="icon-btn">&times;</button>
          </div>
          <div class="modal-body">
            <div id="modal-breadcrumbs" class="modal-breadcrumbs"></div>
            <div class="modal-actions">
                <button id="select-all-modal" class="btn-secondary btn-sm">Seleccionar Todos</button>
                <button id="deselect-all-modal" class="btn-secondary btn-sm">Deseleccionar Todos</button>
            </div>
            <div id="modal-subgroups-grid" class="subgroups-grid"></div>
          </div>
          <div class="modal-footer">
            <button id="save-modal-btn" class="btn-primary">Aceptar</button>
          </div>
      </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
